
name: Python Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-analysis:
    name: Run Code Quality and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 bandit

      - name: Run Pylint
        run: pylint hospital_patient_system.py --fail-under=9.5

      - name: Run Flake8
        run: flake8 hospital_patient_system.py

      - name: Run Bandit
        run: bandit -r hospital_patient_system.py -ll
